<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">AI Nexus</title>
  <desc id="desc">A home for your local AI. Windows source-only developer preview. Original AI Nexus artwork in charcoal and ember orange.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141a1e"/><stop offset=".65" stop-color="#090d10"/><stop offset="1" stop-color="#15100d"/></linearGradient>
    <radialGradient id="ember"><stop stop-color="#e87d2f" stop-opacity=".2"/><stop offset="1" stop-color="#e87d2f" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7ad70"/><stop offset="1" stop-color="#b6531d"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#82939d" stroke-opacity=".055"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1438" height="418" rx="18"/></clipPath>
  </defs>
