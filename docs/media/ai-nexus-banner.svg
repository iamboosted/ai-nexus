    <text x="123" y="81" fill="#a6afb5" font-family="Consolas,monospace" font-size="13" letter-spacing="3">YOUR LOCAL AI, TOGETHER.</text>
    <text x="60" y="224" fill="#f3f5f5" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="100" letter-spacing="-3">AI NEXUS</text>
    <text x="66" y="278" fill="#d3dade" font-family="Segoe UI,Arial,sans-serif" font-size="28">A home for your local AI.</text>
    <text x="67" y="317" fill="#8e9aa2" font-family="Segoe UI,Arial,sans-serif" font-size="17">Models. Context profiles. Monitoring. Your setup.</text>
