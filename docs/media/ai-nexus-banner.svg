      <circle cx="1135" cy="236" r="101" stroke-opacity=".18" stroke-dasharray="4 11"/>
      <path d="M835 281H934L992 223M1274 236H1395M1135 97V36M1135 375V420" stroke-opacity=".22"/>
      <path d="M855 317H968L1000 285M1274 202H1340L1395 147" stroke-opacity=".11"/>
    </g>
    <g fill="#e87d2f"><circle cx="934" cy="281" r="3"/><circle cx="1135" cy="97" r="3"/><circle cx="1274" cy="236" r="3"/><circle cx="1395" cy="147" r="2" opacity=".5"/></g>
    <g transform="translate(1026 127) scale(2.18)">
