[package]
license = "MIT"
name = "ai-nexus-dev"
version = "0.1.0"
description = "Ultralight local-AI command center"
authors = ["iAmBoosted"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "ai_nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
# Already pinned and present through Tauri; use its existing Windows API bindings.
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

